name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      # Coverage rules (ATXTST012, ATXTST013) read the reports produced by the run above, so they
      # can only contribute on a second build. Each test project emits its own report and the
      # analyzers merge them. The path must be absolute: MSBuild resolves a wildcard relative to
      # each project directory, so a repo-relative glob silently matches nothing. This gate is
      # binding — TreatWarningsAsErrors turns any finding into a build error.
      - name: Re-analyze with coverage
        run: dotnet build --no-restore "-p:AutomaticksCoverageReport=${{ github.workspace }}/tests/**/TestResults/coverage.cobertura.xml"
