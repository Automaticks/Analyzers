name: Publish NuGet Packages

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.changes.outputs.HAS_CHANGES }}
      last_tag: ${{ steps.changes.outputs.LAST_TAG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect changes since last release
        id: changes
        run: |
          LAST_TAG=$(git tag --merged HEAD --sort=-v:refname \
            | grep -E '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$' \
            | head -n1 || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag found; this will be the initial release."
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
            echo "LAST_TAG=" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git rev-list --count "$LAST_TAG..HEAD")
            echo "Commits since $LAST_TAG: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
            else
              echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
            fi
            echo "LAST_TAG=$LAST_TAG" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Set version
        id: version
        run: |
          BASE="$(date -u +'%Y.%-m.%-d')"
          VERSION="$BASE"
          N=1
          while git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; do
            VERSION="${BASE}.${N}"
            N=$((N + 1))
            if [ "$N" -gt 100 ]; then
              echo "::error::Exhausted version candidates for $BASE; revisit the versioning scheme."
              exit 1
            fi
          done
          echo "Computed version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack Automaticks.CSharp.Analyzers
        run: dotnet pack src/Automaticks.CSharp.Analyzers/Automaticks.CSharp.Analyzers.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ./nupkg

      - name: Pack Automaticks.Threading.Tasks.Analyzers
        run: dotnet pack src/Automaticks.Threading.Tasks.Analyzers/Automaticks.Threading.Tasks.Analyzers.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ./nupkg

      - name: Pack Automaticks.Linq.Analyzers
        run: dotnet pack src/Automaticks.Linq.Analyzers/Automaticks.Linq.Analyzers.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ./nupkg

      - name: Pack Automaticks.Reflection.Analyzers
        run: dotnet pack src/Automaticks.Reflection.Analyzers/Automaticks.Reflection.Analyzers.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ./nupkg

      - name: Pack Automaticks.Extensions.Options.Analyzers
        run: dotnet pack src/Automaticks.Extensions.Options.Analyzers/Automaticks.Extensions.Options.Analyzers.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ./nupkg

      - name: Pack Automaticks.Diagnostics.CodeAnalysis.Analyzers
        run: dotnet pack src/Automaticks.Diagnostics.CodeAnalysis.Analyzers/Automaticks.Diagnostics.CodeAnalysis.Analyzers.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ./nupkg

      - name: Pack Automaticks.CommunityToolkit.Mvvm.Analyzers
        run: dotnet pack src/Automaticks.CommunityToolkit.Mvvm.Analyzers/Automaticks.CommunityToolkit.Mvvm.Analyzers.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ./nupkg

      - name: Pack Automaticks.EntityFrameworkCore.Analyzers
        run: dotnet pack src/Automaticks.EntityFrameworkCore.Analyzers/Automaticks.EntityFrameworkCore.Analyzers.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ./nupkg

      - name: Pack Automaticks.Testing.Analyzers
        run: dotnet pack src/Automaticks.Testing.Analyzers/Automaticks.Testing.Analyzers.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ./nupkg

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          LAST_TAG: ${{ needs.check.outputs.last_tag }}
        run: |
          if [ -n "$LAST_TAG" ]; then
            NOTES_ARGS=(--notes-start-tag "$LAST_TAG" --generate-notes)
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "$VERSION" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            "${NOTES_ARGS[@]}" \
            ./nupkg/*.nupkg
